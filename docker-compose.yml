# Berry local stack — product API, execution substrate, and backing services.
#
#   berry-api  Go product/control-plane API (localhost:4000)
#   openfang   OpenFang agent kernel + REST/WS/SSE + OpenAI-compatible API (localhost:4200)
#   postgres   Berry-owned durable product state (issues, runs, comments, ...) — ADR-0002
#   valkey     Berry shared cache + ephemeral coordination state — ADR-0002
#
# OpenFang is PINNED to an immutable upstream commit (ADR-0003). The single source of
# truth for the pin is deploy/openfang.pin.json; the OPENFANG_COMMIT default below MUST
# equal the `commit` field there. OpenFang keeps its own state in a SQLite database under
# the /data volume — it does NOT use the Berry Postgres or Valkey instances.
#
# Boot from clean:  cp .env.example .env  &&  docker compose up -d --build
# Full guide:       README.md

name: berry-stack

services:
  berry-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: berry-api:local
    # The image defaults to the API binary. Compose deliberately runs the
    # forward-only migrator first so readiness never races schema setup.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "/usr/local/bin/berry-migrate && /usr/local/bin/berry-seed && exec /usr/local/bin/berry-api"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      openfang:
        condition: service_healthy
      temporal:
        condition: service_healthy
      # The bucket must exist before the first artifact upload; waiting on the
      # job rather than on minio itself is what makes that ordering real.
      minio-bucket:
        condition: service_completed_successfully
    environment:
      APP_ENV: "${APP_ENV:-development}"
      SERVICE_NAME: "${SERVICE_NAME:-berry-server}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      API_ADDR: "0.0.0.0:4000"
      DATABASE_URL: "${BERRY_DATABASE_URL:-postgres://berry:berry@postgres:5432/berry?sslmode=disable}"
      VALKEY_ENABLED: "${VALKEY_ENABLED:-true}"
      VALKEY_REQUIRED: "${VALKEY_REQUIRED:-true}"
      VALKEY_URL: "${BERRY_VALKEY_URL:-redis://valkey:6379/0}"
      CACHE_FAIL_OPEN: "${CACHE_FAIL_OPEN:-true}"
      RATE_LIMIT_FAIL_OPEN: "${RATE_LIMIT_FAIL_OPEN:-false}"
      OPENFANG_BASE_URL: "http://openfang:4200"
      # Server-side only: never mirror this value into a NEXT_PUBLIC_* variable.
      OPENFANG_API_KEY: "${OPENFANG_API_KEY:-}"
      # Which runtime owns agents. Under adk they are Berry rows, so this
      # server stops projecting OpenFang's over them on every listing.
      BERRY_AGENT_RUNTIME: "${BERRY_AGENT_RUNTIME:-openfang}"
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      TRUSTED_ORIGINS: "${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-s3}"
      STORAGE_LOCAL_ROOT: "/data/uploads"
      STORAGE_MAX_BYTES: "${STORAGE_MAX_BYTES:-26214400}"
      S3_BUCKET: "${S3_BUCKET:-berry-artifacts}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://minio:9000}"
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-true}"
      # Standard AWS credentials are server-side only. Empty values use the
      # SDK's workload/instance credential chain when S3 is enabled.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-berryminio}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-berryminio}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      SESSION_TTL: "${SESSION_TTL:-720h}"
      AUTH_ALLOW_PASSWORDLESS_LOGIN: "${AUTH_ALLOW_PASSWORDLESS_LOGIN:-true}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-15s}"
      REALTIME_BUFFER: "${REALTIME_BUFFER:-64}"
      # Blank node id generates a unique process id. Required relay mode makes
      # /ready fail when cross-node invalidation cannot reach Valkey.
      REALTIME_NODE_ID: "${REALTIME_NODE_ID:-}"
      REALTIME_RELAY_REQUIRED: "${REALTIME_RELAY_REQUIRED:-true}"
      REALTIME_STREAM_MAXLEN: "${REALTIME_STREAM_MAXLEN:-10000}"
      REALTIME_STREAM_TTL: "${REALTIME_STREAM_TTL:-15m}"
      REALTIME_READ_BLOCK: "${REALTIME_READ_BLOCK:-5s}"
      # Durable run orchestration (ADR-0005). Disabled selects the in-process
      # dispatcher, which is a supported configuration.
      TEMPORAL_ENABLED: "${TEMPORAL_ENABLED:-true}"
      TEMPORAL_REQUIRED: "${TEMPORAL_REQUIRED:-true}"
      TEMPORAL_HOSTPORT: "${TEMPORAL_HOSTPORT:-temporal:7233}"
      TEMPORAL_NAMESPACE: "${TEMPORAL_NAMESPACE:-berry}"
      TEMPORAL_TASK_QUEUE: "${TEMPORAL_TASK_QUEUE:-berry-runs}"
      # The API is the single process that provisions each workspace's
      # built-in orchestrator upstream (cmd/api), so it needs the model the
      # deployment chose. Unset leaves the orchestrator offline.
      ORCHESTRATOR_PROVIDER: "${ORCHESTRATOR_PROVIDER:-}"
      ORCHESTRATOR_MODEL: "${ORCHESTRATOR_MODEL:-}"
      INFOBIP_ENABLED: "${INFOBIP_ENABLED:-false}"
      INFOBIP_BASE_URL: "${INFOBIP_BASE_URL:-}"
      INFOBIP_API_KEY: "${INFOBIP_API_KEY:-}"
      INFOBIP_WHATSAPP_FROM: "${INFOBIP_WHATSAPP_FROM:-}"
      INFOBIP_SMS_FROM: "${INFOBIP_SMS_FROM:-}"
      INFOBIP_WEBHOOK_SECRET: "${INFOBIP_WEBHOOK_SECRET:-}"
      # Native integrations. Berry owns the connection and the credential;
      # the runtime's MCP servers make the provider calls.
      INTEGRATION_ENCRYPTION_KEY: "${INTEGRATION_ENCRYPTION_KEY:-}"
      INTEGRATION_CALLBACK_BASE_URL: "${INTEGRATION_CALLBACK_BASE_URL:-}"
      INTEGRATION_REDIRECT_ALLOWLIST: "${INTEGRATION_REDIRECT_ALLOWLIST:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-}"
      SLACK_CLIENT_ID: "${SLACK_CLIENT_ID:-}"
      SLACK_CLIENT_SECRET: "${SLACK_CLIENT_SECRET:-}"
      LINEAR_CLIENT_ID: "${LINEAR_CLIENT_ID:-}"
      LINEAR_CLIENT_SECRET: "${LINEAR_CLIENT_SECRET:-}"
      NOTION_CLIENT_ID: "${NOTION_CLIENT_ID:-}"
      NOTION_CLIENT_SECRET: "${NOTION_CLIENT_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    ports:
      - "127.0.0.1:${BERRY_API_PORT:-4000}:4000"
    volumes:
      - berry-uploads:/data/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/ready"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    restart: unless-stopped

  openfang:
    # Build from the exact pinned upstream commit (BuildKit git context). No mutable
    # branch or image tag is trusted. GHCR image is not public yet; build from source.
    build:
      context: "https://github.com/RightNow-AI/openfang.git#${OPENFANG_COMMIT:-acf2587e46be174c10200489c9a2d23a39a98aeb}"
      # Dev-fast defaults: skip LTO and use more codegen units. Override to LTO=true /
      # CODEGEN_UNITS=1 for a release-optimized build (much slower to compile).
      args:
        LTO: "${OPENFANG_BUILD_LTO:-false}"
        CODEGEN_UNITS: "${OPENFANG_BUILD_CODEGEN_UNITS:-16}"
    image: "berry-openfang:${OPENFANG_COMMIT_SHORT:-acf2587e}"
    ports:
      - "127.0.0.1:${OPENFANG_PORT:-4200}:4200"
    environment:
      # Required in Docker: OpenFang binds loopback-only by default, which is unreachable
      # through a published port. See docs/adr/0003 and OpenFang docs/configuration.md.
      OPENFANG_LISTEN: "0.0.0.0:4200"
      # Required for container-to-container API calls. Empty keeps authenticated
      # non-loopback requests fail-closed (health stays public).
      OPENFANG_API_KEY: "${OPENFANG_API_KEY:-}"
      OPENFANG_HOME: "/data"
      RUST_LOG: "${OPENFANG_LOG:-info}"
      # LLM providers — set only the ones you use (auto-detected at boot).
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      # Qwen via a local vLLM server (parent issue BERR-2). Point at the host, e.g.
      # VLLM_BASE_URL=http://host.docker.internal:8000
      VLLM_BASE_URL: "${VLLM_BASE_URL:-}"
      VLLM_API_KEY: "${VLLM_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      # Named by default_model.api_key_env in deploy/openfang/config.toml.
      # BERRY_-prefixed first: a stale OPENROUTER_API_KEY exported in the
      # launching shell outranks .env for Compose substitution, and has twice
      # revived a spent key. Nothing exports the namespaced name.
      OPENROUTER_API_KEY: "${BERRY_OPENROUTER_API_KEY:-${OPENROUTER_API_KEY:-}}"
    volumes:
      - openfang-data:/data
      # Config as code: the runtime uses the file in the repository rather than
      # whatever accumulated in the volume. Read-only so a container cannot
      # silently rewrite it — drop :ro if OpenFang ever needs to persist here.
      - ./deploy/openfang/config.toml:/data/config.toml:ro
    # Lets the container reach host-run providers (vLLM/Ollama) via host.docker.internal.
    # No-op on Docker Desktop; required on Linux/colima.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # python3 ships in the OpenFang runtime image; curl/wget do not.
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4200/api/health', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped

  # Durable orchestration workers: continuous task intake and run dispatch.
  # Separate from berry-api on purpose — workers hold long-lived agent streams,
  # so an API deploy must not kill live agent work. Scale with --scale
  # berry-worker=N; the intake loop stays a singleton via its fixed workflow ID.
  # The TypeScript product server, answering the prefixes listed in
  # frontend/next.config.ts's TYPESCRIPT_ROUTES. It reads the same database as
  # berry-api — that shared schema is what makes moving one prefix at a time
  # safe — and is absent from the frontend's routing until BERRY_TS_API_ORIGIN
  # is set, so running it costs nothing until something points at it.
  berry-api-ts:
    build:
      context: ./server-ts
      dockerfile: Dockerfile
    image: berry-api-ts:local
    depends_on:
      postgres:
        condition: service_healthy
      # Migrations belong to berry-api and run once; this server reads the
      # schema they produce and never writes one of its own.
      berry-api:
        condition: service_healthy
      # Agents write files, so the bucket has to exist before one runs.
      minio-bucket:
        condition: service_completed_successfully
    environment:
      APP_ENV: "${APP_ENV:-development}"
      SERVICE_NAME: "${SERVICE_NAME:-berry-server-ts}"
      API_ADDR: "0.0.0.0:4100"
      DATABASE_URL: "${BERRY_DATABASE_URL:-postgres://berry:berry@postgres:5432/berry?sslmode=disable}"
      SESSION_TTL: "${SESSION_TTL:-720h}"
      AUTH_ALLOW_PASSWORDLESS_LOGIN: "${AUTH_ALLOW_PASSWORDLESS_LOGIN:-true}"
      REALTIME_BUFFER: "${REALTIME_BUFFER:-64}"
      # Metrics are Go's; this server answers 404 on /metrics and says so.
      METRICS_ENABLED: "false"
      # Agent execution: the model credential and the bucket an agent's files
      # land in. Without both, this server reports agentExecution false and
      # refuses run requests rather than accepting ones it cannot serve.
      BERRY_OPENROUTER_API_KEY: "${BERRY_OPENROUTER_API_KEY:-${OPENROUTER_API_KEY:-}}"
      BERRY_AGENT_DEFAULT_MODEL: "${BERRY_AGENT_DEFAULT_MODEL:-anthropic/claude-sonnet-4.5}"
      STORAGE_MAX_BYTES: "${STORAGE_MAX_BYTES:-26214400}"
      S3_BUCKET: "${S3_BUCKET:-berry-artifacts}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://minio:9000}"
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-berryminio}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-berryminio}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      # The shared secret the worker presents to run an agent. Empty turns the
      # internal surface off entirely rather than leaving it open.
      BERRY_INTERNAL_TOKEN: "${BERRY_INTERNAL_TOKEN:-}"
    ports:
      - "127.0.0.1:${BERRY_API_TS_PORT:-4100}:4100"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    restart: unless-stopped

  berry-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: berry-api:local
    entrypoint: ["/usr/local/bin/berry-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      openfang:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-development}"
      SERVICE_NAME: "${SERVICE_NAME:-berry-server}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DATABASE_URL: "${BERRY_DATABASE_URL:-postgres://berry:berry@postgres:5432/berry?sslmode=disable}"
      VALKEY_ENABLED: "${VALKEY_ENABLED:-true}"
      VALKEY_REQUIRED: "${VALKEY_REQUIRED:-true}"
      VALKEY_URL: "${BERRY_VALKEY_URL:-redis://valkey:6379/0}"
      OPENFANG_BASE_URL: "http://openfang:4200"
      # Server-side only: never mirror this value into a NEXT_PUBLIC_* variable.
      OPENFANG_API_KEY: "${OPENFANG_API_KEY:-}"
      # Agent execution: with adk the worker asks the TypeScript server to run
      # the agent instead of dispatching to OpenFang in process. Admission and
      # cancellation stay here either way.
      # The peer reviewer calls its model directly rather than through the
      # runtime's chat route. Server-side only: never mirror into NEXT_PUBLIC_*.
      BERRY_OPENROUTER_API_KEY: "${BERRY_OPENROUTER_API_KEY:-${OPENROUTER_API_KEY:-}}"
      BERRY_AGENT_RUNTIME: "${BERRY_AGENT_RUNTIME:-openfang}"
      BERRY_AGENT_RUNTIME_URL: "${BERRY_AGENT_RUNTIME_URL:-http://berry-api-ts:4100}"
      BERRY_INTERNAL_TOKEN: "${BERRY_INTERNAL_TOKEN:-}"
      TEMPORAL_ENABLED: "true"
      TEMPORAL_REQUIRED: "true"
      TEMPORAL_HOSTPORT: "${TEMPORAL_HOSTPORT:-temporal:7233}"
      TEMPORAL_NAMESPACE: "${TEMPORAL_NAMESPACE:-berry}"
      TEMPORAL_TASK_QUEUE: "${TEMPORAL_TASK_QUEUE:-berry-runs}"
      # Continuous intake of todo issues by available agents.
      INTAKE_ENABLED: "${INTAKE_ENABLED:-false}"
      INTAKE_INTERVAL: "${INTAKE_INTERVAL:-10s}"
      INTAKE_BATCH_SIZE: "${INTAKE_BATCH_SIZE:-10}"
      # Concurrent agent runs Berry will hold open. This is a provider-spend
      # ceiling, not just a throughput knob.
      INTAKE_MAX_CONCURRENT: "${INTAKE_MAX_CONCURRENT:-8}"
      # A users.id. Automated runs are attributed to this identity because
      # runs.requested_by is a foreign key and the audit trail must name someone.
      INTAKE_ACTOR_ID: "${INTAKE_ACTOR_ID:-}"
      # The built-in orchestrator needs a model to exist in OpenFang. Unset
      # leaves it offline and skipped by intake rather than failing runs.
      ORCHESTRATOR_PROVIDER: "${ORCHESTRATOR_PROVIDER:-}"
      ORCHESTRATOR_MODEL: "${ORCHESTRATOR_MODEL:-}"
      # Infobip carries conversations and calls off-platform. Server-side only.
      INFOBIP_ENABLED: "${INFOBIP_ENABLED:-false}"
      INFOBIP_BASE_URL: "${INFOBIP_BASE_URL:-}"
      INFOBIP_API_KEY: "${INFOBIP_API_KEY:-}"
      INFOBIP_WHATSAPP_FROM: "${INFOBIP_WHATSAPP_FROM:-}"
      INFOBIP_SMS_FROM: "${INFOBIP_SMS_FROM:-}"
      INFOBIP_WEBHOOK_SECRET: "${INFOBIP_WEBHOOK_SECRET:-}"
      # The runtime volume is mounted at /runtime-workspaces below; agent
      # directories sit one level down under workspaces/. Promotion is off
      # when unset, so a deployment without the mount is unaffected.
      RUNTIME_WORKSPACE_ROOT: "${RUNTIME_WORKSPACE_ROOT:-/runtime-workspaces/workspaces}"
      # The worker dispatches every run admitted by intake, so it needs the
      # same credential access the API has to build repository context.
      INTEGRATION_ENCRYPTION_KEY: "${INTEGRATION_ENCRYPTION_KEY:-}"
      # Not used here — the worker serves no OAuth routes — but the shared
      # config refuses to start with a key and no callback URLs, and that
      # early failure is worth keeping for the process that does serve them.
      INTEGRATION_CALLBACK_BASE_URL: "${INTEGRATION_CALLBACK_BASE_URL:-}"
      INTEGRATION_REDIRECT_ALLOWLIST: "${INTEGRATION_REDIRECT_ALLOWLIST:-}"
      # Artifact promotion writes a finished run's output to the same
      # object store the API serves attachments from, so the worker needs
      # the identical storage configuration (ADR-0006).
      STORAGE_BACKEND: "${STORAGE_BACKEND:-s3}"
      STORAGE_LOCAL_ROOT: "/data/uploads"
      STORAGE_MAX_BYTES: "${STORAGE_MAX_BYTES:-26214400}"
      S3_BUCKET: "${S3_BUCKET:-berry-artifacts}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://minio:9000}"
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-berryminio}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-berryminio}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-15s}"
      REALTIME_RELAY_REQUIRED: "${REALTIME_RELAY_REQUIRED:-true}"
    # The image is shared with berry-api, whose Dockerfile HEALTHCHECK probes
    # http://127.0.0.1:4000/health. This process serves no HTTP, so that check
    # can only ever fail and reports a healthy worker as unhealthy. Disabled
    # rather than replaced with something that always passes: a check that
    # cannot fail looks like verification without being any.
    #
    # A meaningful probe would confirm the worker is polling its task queue,
    # which needs the worker to expose an endpoint of its own.
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Temporal reuses the existing Postgres instance with its own databases, so
  # self-hosting gains one service rather than a whole new datastore.
    volumes:
      # Read-only: the worker reads a finished run's output and copies it
      # into object storage. It must never be able to write to the
      # runtime's filesystem.
      - openfang-data:/runtime-workspaces:ro

  temporal:
    image: temporalio/auto-setup:1.29.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: "${POSTGRES_USER:-berry}"
      POSTGRES_PWD: "${POSTGRES_PASSWORD:-berry}"
      DBNAME: "${TEMPORAL_DBNAME:-temporal}"
      VISIBILITY_DBNAME: "${TEMPORAL_VISIBILITY_DBNAME:-temporal_visibility}"
      DEFAULT_NAMESPACE: "${TEMPORAL_NAMESPACE:-berry}"
      DEFAULT_NAMESPACE_RETENTION: "${TEMPORAL_RETENTION:-72h}"
    ports:
      # Loopback-only: the frontend never talks to Temporal.
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      # Addressed by service name, not loopback: the frontend binds the
      # container's own IP, so 127.0.0.1 inside the container is refused and
      # the service never turns healthy — which blocks everything that waits
      # on it.
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 8
    restart: unless-stopped

  # Operator UI for inspecting workflows and their history. Published on
  # loopback only: it renders run payloads, which carry issue content and agent
  # output, and it has no authentication of its own.
  temporal-ui:
    image: temporalio/ui:2.53.3
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"
    restart: unless-stopped

  minio:
    # S3-compatible object storage for artifacts (ADR-0006). Development runs the
    # same S3 code path as deployment rather than the local-filesystem backend,
    # so presigning and content-type behaviour are exercised here instead of
    # first appearing in production.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID:-berryminio}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-berryminio}"
    ports:
      # Loopback-only: these are weak dev credentials, so never expose the API or
      # console beyond the local host.
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - berry-artifacts:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  minio-bucket:
    # Creates the artifact bucket once, then exits. A missing bucket otherwise
    # surfaces as an opaque S3 error on the first upload rather than at startup.
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set berry http://minio:9000 \
          "${AWS_ACCESS_KEY_ID:-berryminio}" "${AWS_SECRET_ACCESS_KEY:-berryminio}" &&
        mc mb --ignore-existing "berry/${S3_BUCKET:-berry-artifacts}" &&
        echo "artifact bucket ready"
    restart: "no"

  postgres:
    # Berry's durable system of record. Keep PostgreSQL 16 on this existing
    # named volume; a future 17 upgrade must migrate into a separate volume.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-berry}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-berry}"
      POSTGRES_DB: "${POSTGRES_DB:-berry}"
    ports:
      # Loopback-only: default creds are weak dev creds, so never expose Postgres
      # beyond the local host. Host-run tools reach it via localhost.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - berry-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-berry} -d ${POSTGRES_DB:-berry}"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  valkey:
    # Shared cache + ephemeral coordination. Must tolerate a clean flush (ADR-0002):
    # nothing durable lives here, so light persistence is enough.
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      # Loopback-only: Valkey runs without auth here, so never expose it beyond
      # the local host. Host-run tools reach it via localhost.
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - berry-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped

volumes:
  openfang-data:
  berry-postgres:
  berry-valkey:
  berry-artifacts:
  berry-uploads:
