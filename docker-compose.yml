# Berry local stack — product API and backing services.
#
#   berry-api  TypeScript product API (localhost:4000)
#   runtime    Where an agent's commands run — one container per run
#   postgres   Berry-owned durable product state (issues, runs, comments, ...) — ADR-0002
#   minio      S3-compatible object storage for run artifacts — ADR-0006
#
# Boot from clean:  cp .env.example .env  &&  docker compose up -d --build
# Full guide:       README.md

name: berry-stack

services:
  berry-api:
    build:
      context: ./server-ts
      dockerfile: Dockerfile
    image: berry-api:local
    # The image defaults to the server. Compose deliberately runs the
    # forward-only migrator first so readiness never races schema setup, and
    # the seeder after it so a clean volume comes up with something to log
    # into. Both are idempotent, so this is safe on every boot.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        node --experimental-strip-types src/migrate/index.ts &&
        node --experimental-strip-types src/seed/index.ts &&
        exec node --experimental-strip-types src/index.ts
    depends_on:
      postgres:
        condition: service_healthy
      # The bucket must exist before the first artifact upload; waiting on the
      # job rather than on minio itself is what makes that ordering real.
      minio-bucket:
        condition: service_completed_successfully
      runtime:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-development}"
      SERVICE_NAME: "${SERVICE_NAME:-berry-server}"
      API_ADDR: "0.0.0.0:4000"
      DATABASE_URL: "${BERRY_DATABASE_URL:-postgres://berry:berry@postgres:5432/berry?sslmode=disable}"
      SESSION_TTL: "${SESSION_TTL:-720h}"
      AUTH_ALLOW_PASSWORDLESS_LOGIN: "${AUTH_ALLOW_PASSWORDLESS_LOGIN:-true}"
      # Sign-in (Better Auth, GitHub only). A separate GitHub OAuth App from
      # GITHUB_CLIENT_ID below, with callback <BERRY_APP_URL>/api/auth/callback/github.
      # Server-side only: never mirror these into a NEXT_PUBLIC_* variable.
      BERRY_AUTH_SECRET: "${BERRY_AUTH_SECRET:-}"
      BERRY_AUTH_GITHUB_CLIENT_ID: "${BERRY_AUTH_GITHUB_CLIENT_ID:-}"
      BERRY_AUTH_GITHUB_CLIENT_SECRET: "${BERRY_AUTH_GITHUB_CLIENT_SECRET:-}"
      # Set to false to seed the identity and board but no demo tasks or
      # projects — and to stop them reappearing on every boot once deleted.
      BERRY_SEED_DEMO_WORK: "${BERRY_SEED_DEMO_WORK:-true}"
      # AutoGate: how many times a peer reviewer may send a task back before
      # a person decides. Media: where Nova Reel writes a rendered video (a
      # real S3 bucket the Bedrock credential can read and write); empty
      # means agents can make speech but not video.
      BERRY_AUTOGATE_MAX_ATTEMPTS: "${BERRY_AUTOGATE_MAX_ATTEMPTS:-2}"
      BERRY_MEDIA_VIDEO_S3_URI: "${BERRY_MEDIA_VIDEO_S3_URI:-}"
      REALTIME_BUFFER: "${REALTIME_BUFFER:-64}"
      # Agent execution: the model credential and the bucket an agent's files
      # land in. Without both, this server reports agentExecution false and
      # refuses run requests rather than accepting ones it cannot serve.
      #
      # Bedrock is reached with SigV4, so there is no model API key here. On
      # EC2, ECS or Lambda the instance role supplies the credential and the
      # deployment holds no long-lived model secret at all.
      BERRY_BEDROCK_REGION: "${BERRY_BEDROCK_REGION:-${AWS_REGION:-us-east-1}}"
      # Deliberately not AWS_ACCESS_KEY_ID: that name already carries MinIO's
      # `minioadmin` for object storage below, and sharing it would send
      # MinIO's credentials to AWS. Leave empty to use the instance role.
      BERRY_BEDROCK_ACCESS_KEY_ID: "${BERRY_BEDROCK_ACCESS_KEY_ID:-}"
      BERRY_BEDROCK_SECRET_ACCESS_KEY: "${BERRY_BEDROCK_SECRET_ACCESS_KEY:-}"
      BERRY_BEDROCK_SESSION_TOKEN: "${BERRY_BEDROCK_SESSION_TOKEN:-}"
      # An inference profile, not a bare model id: Anthropic models on Bedrock
      # are only invocable through a cross-region profile in most regions.
      # Haiku 4.5 rather than Sonnet: a third of the price ($1/$5 per million
      # against $3/$15) and still reliable at a tool-calling loop, which is what
      # a run is. This is the fallback for an agent naming no model of its own.
      BERRY_AGENT_DEFAULT_MODEL: "${BERRY_AGENT_DEFAULT_MODEL:-us.anthropic.claude-haiku-4-5-20251001-v1:0}"
      # Signs and verifies inbound GitHub webhooks. Empty disables the route
      # outright rather than leaving it unauthenticated: anyone who could reach
      # it would otherwise be able to close every task in the deployment.
      #
      # Webhooks stay direct from GitHub: the gateway carries outbound calls,
      # and AgentCore offers no inbound event stream to replace this.
      BERRY_GITHUB_WEBHOOK_SECRET: "${BERRY_GITHUB_WEBHOOK_SECRET:-}"
      # GitHub through AgentCore Gateway. `legacy` falls back to Berry's own
      # client and GitHub App, so a rollback is one variable rather than a
      # revert.
      GITHUB_PROVIDER: "${GITHUB_PROVIDER:-agentcore}"
      AWS_AGENTCORE_REGION: "${AWS_AGENTCORE_REGION:-${AWS_REGION:-us-east-1}}"
      # The gateway's MCP endpoint. Empty leaves the gateway unconfigured and
      # Berry falls back rather than failing.
      AWS_AGENTCORE_GATEWAY_URL: "${AWS_AGENTCORE_GATEWAY_URL:-}"
      # The OAuth2 credential provider AgentCore Identity holds GitHub in.
      # This is what replaces Berry's own OAuth and App private key.
      AWS_AGENTCORE_GITHUB_PROVIDER: "${AWS_AGENTCORE_GITHUB_PROVIDER:-}"
      AWS_AGENTCORE_WORKLOAD_NAME: "${AWS_AGENTCORE_WORKLOAD_NAME:-berry}"
      # Only for a gateway whose tool names defeat discovery. Normally empty:
      # names come from tools/list, never from here.
      BERRY_AGENTCORE_TOOL_MAP: "${BERRY_AGENTCORE_TOOL_MAP:-}"
      # AgentCore, when an agent's commands should run there rather than in the
      # Docker sandbox. Set BERRY_RUNTIME_DRIVER=agentcore to switch.
      BERRY_AGENTCORE_REGION: "${BERRY_AGENTCORE_REGION:-}"
      BERRY_AGENTCORE_CODE_INTERPRETER_ID: "${BERRY_AGENTCORE_CODE_INTERPRETER_ID:-aws.codeinterpreter.v1}"
      BERRY_AGENTCORE_RUNTIME_ARN: "${BERRY_AGENTCORE_RUNTIME_ARN:-}"
      BERRY_AGENTCORE_MEMORY_ID: "${BERRY_AGENTCORE_MEMORY_ID:-}"
      # Deliberately not AWS_ACCESS_KEY_ID, for the same reason Bedrock is not:
      # that name holds MinIO's credentials below, so an AgentCore client left
      # on the default chain authenticates to AWS as the object store and is
      # refused. Falls back to the Bedrock pair, which is already AWS's.
      BERRY_AGENTCORE_ACCESS_KEY_ID: "${BERRY_AGENTCORE_ACCESS_KEY_ID:-}"
      BERRY_AGENTCORE_SECRET_ACCESS_KEY: "${BERRY_AGENTCORE_SECRET_ACCESS_KEY:-}"
      BERRY_AGENTCORE_SESSION_TOKEN: "${BERRY_AGENTCORE_SESSION_TOKEN:-}"
      STORAGE_MAX_BYTES: "${STORAGE_MAX_BYTES:-26214400}"
      S3_BUCKET: "${S3_BUCKET:-berry-artifacts}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://minio:9000}"
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-true}"
      # Standard AWS credentials are server-side only. Empty values use the
      # SDK's workload/instance credential chain when S3 is enabled.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-berryminio}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-berryminio}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      # Where an agent's commands run: `docker` (the runtime service over HTTP —
      # the API never touches the Docker socket itself, which is why `runtime`
      # is separate), `agentcore` (Bedrock AgentCore Code Interpreter), or
      # `agentcore-runtime` (a deployed AgentCore Runtime by ARN). URL and token
      # are read only by the `docker` driver.
      BERRY_RUNTIME_DRIVER: "${BERRY_RUNTIME_DRIVER:-docker}"
      BERRY_RUNTIME_URL: "${BERRY_RUNTIME_URL:-http://runtime:4300}"
      BERRY_RUNTIME_TOKEN: "${BERRY_RUNTIME_TOKEN:-}"
      # Seals provider credentials at rest. Empty leaves integrations off, so a
      # run never gets a repository — which is a working deployment, rather
      # than one that fails at the clone with a decryption error.
      # Server-side only: never mirror this into a NEXT_PUBLIC_* variable.
      INTEGRATION_ENCRYPTION_KEY: "${INTEGRATION_ENCRYPTION_KEY:-}"
      # Connecting GitHub. Without both halves the catalogue reports the
      # provider as not configured, which is a better answer than a Connect
      # button that leads to a redirect the provider refuses.
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      # Where GitHub sends the browser back. Not derivable from a request:
      # behind a proxy the request's own host is the proxy's, and a
      # redirect_uri that does not match the registered one is refused before
      # Berry sees it.
      BERRY_PUBLIC_URL: "${BERRY_PUBLIC_URL:-http://localhost:4000}"
      BERRY_APP_URL: "${BERRY_APP_URL:-http://localhost:3000}"
    ports:
      - "127.0.0.1:${BERRY_API_PORT:-4000}:4000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    restart: unless-stopped

  runtime:
    # Where an agent's commands run: one disposable container per run, on this
    # host's own Docker daemon.
    #
    # It exists as a separate service for one reason. Reaching the Docker
    # socket is root-equivalent on the host, and berry-api runs read-only with
    # every capability dropped — putting the socket here keeps that posture
    # intact. berry-api talks to this over HTTP with a shared secret, exactly
    # as it would talk to a remote substrate.
    build:
      # The runtime source moved under server-ts (one package to reason about),
      # but it still ships as its own image and runs as its own service so the
      # Docker socket stays out of berry-api.
      context: ./server-ts
      dockerfile: sandbox/docker/Dockerfile.runtime
    image: berry-runtime:local
    depends_on:
      # The image runs happen in has to exist before the first run asks for
      # one; the service would otherwise pull it mid-run, or fail.
      sandbox-image:
        condition: service_completed_successfully
    environment:
      RUNTIME_ADDR: "0.0.0.0:4300"
      # Empty makes every route refuse rather than leaving an unauthenticated
      # command runner on the Compose network.
      BERRY_RUNTIME_TOKEN: "${BERRY_RUNTIME_TOKEN:-}"
      BERRY_SANDBOX_IMAGE: "${BERRY_SANDBOX_IMAGE:-berry-sandbox:local}"
      BERRY_SANDBOX_WORKDIR: "${BERRY_SANDBOX_WORKDIR:-/workspace}"
      BERRY_SANDBOX_MEMORY_MB: "${BERRY_SANDBOX_MEMORY_MB:-2048}"
      BERRY_SANDBOX_CPUS: "${BERRY_SANDBOX_CPUS:-1}"
      BERRY_SANDBOX_PIDS: "${BERRY_SANDBOX_PIDS:-512}"
      BERRY_SANDBOX_NETWORK: "${BERRY_SANDBOX_NETWORK:-bridge}"
      # The ceiling that turns "the host fell over" into "the run waited".
      BERRY_SANDBOX_MAX_CONTAINERS: "${BERRY_SANDBOX_MAX_CONTAINERS:-8}"
    volumes:
      # Root-equivalent on the host. This is the one service that gets it, and
      # the reason it is not berry-api.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Loopback-only, and only for debugging: nothing outside this host should
      # reach a service that runs commands.
      - "127.0.0.1:${RUNTIME_PORT:-4300}:4300"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Reports degraded when the daemon is unreachable, so an unhealthy
      # runtime is distinguishable from a missing one.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    restart: unless-stopped

  sandbox-image:
    # Builds the image runs happen in, then exits. A build service rather than
    # a pull, because the image needs git and a package manager that the stock
    # node image does not carry.
    build:
      context: ./server-ts/sandbox/docker
      dockerfile: Dockerfile
    image: "${BERRY_SANDBOX_IMAGE:-berry-sandbox:local}"
    command: ["true"]
    restart: "no"

  minio:
    # S3-compatible object storage for artifacts (ADR-0006). Development runs the
    # same S3 code path as deployment rather than a local-filesystem backend,
    # so presigning and content-type behaviour are exercised here instead of
    # first appearing in production.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID:-berryminio}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-berryminio}"
    ports:
      # Loopback-only: these are weak dev credentials, so never expose the API or
      # console beyond the local host.
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - berry-artifacts:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  minio-bucket:
    # Creates the artifact bucket once, then exits. A missing bucket otherwise
    # surfaces as an opaque S3 error on the first upload rather than at startup.
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set berry http://minio:9000 \
          "${AWS_ACCESS_KEY_ID:-berryminio}" "${AWS_SECRET_ACCESS_KEY:-berryminio}" &&
        mc mb --ignore-existing "berry/${S3_BUCKET:-berry-artifacts}" &&
        echo "artifact bucket ready"
    restart: "no"

  postgres:
    # Berry's durable system of record. Keep PostgreSQL 16 on this existing
    # named volume; a future 17 upgrade must migrate into a separate volume.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-berry}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-berry}"
      POSTGRES_DB: "${POSTGRES_DB:-berry}"
    ports:
      # Loopback-only: default creds are weak dev creds, so never expose Postgres
      # beyond the local host. Host-run tools reach it via localhost.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - berry-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-berry} -d ${POSTGRES_DB:-berry}"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

volumes:
  berry-postgres:
  berry-artifacts:
