name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify immutable deployment pins
        run: python3 scripts/check-deploy-pins.py

      - name: Validate Compose configuration
        run: python3 scripts/check-compose-config.py

  go:
    name: Go product server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go from module
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf 'Files need gofmt:\n%s\n' "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Verify migration ordering and checksums
        run: >-
          go test -count=1
          -run 'Test(ListOrdersUniqueMigrationsAndComputesChecksums|LoadFSRejectsDuplicateVersions|ChecksumChangesWhenMigrationChanges|LoadFSRejectsInvalidFilename)$'
          ./migrations

      - name: Verify checked-in database artifacts
        run: |
          python3 ../scripts/check-sqlc-artifacts.py --require-tracked
          go test ./pkg/db/...

      - name: Run govulncheck when registered
        shell: bash
        run: |
          if python3 -c "import pathlib,re,sys; text=pathlib.Path('go.mod').read_text(); sys.exit(0 if re.search(r'(?m)^\\s*(?:tool\\s+)?golang\\.org/x/vuln/cmd/govulncheck\\s*$', text) else 1)"; then
            go tool govulncheck ./...
          else
            echo "govulncheck is not registered in server/go.mod; optional gate not applicable."
          fi

      - name: Build API and migrator
        run: |
          go build -trimpath -o "${RUNNER_TEMP}/berry-api" ./cmd/api
          go build -trimpath -o "${RUNNER_TEMP}/berry-migrate" ./cmd/migrate

  gateway:
    name: Bun gateway oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

  frontend:
    name: Next.js frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      BERRY_API_ORIGIN: http://127.0.0.1:4000
      NEXT_PUBLIC_BERRY_API_URL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
